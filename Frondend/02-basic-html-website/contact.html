<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0;
        box-sizing: border-box;
        width: 100%;
        max-width: 1100px;
        font-family: "PT sans", sans-serif;
      }
      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        box-sizing: border-box;
        padding: 20px 0;
      }
      .image {
        width: 35px;
        height: 35px;
        margin-right: 5px;
      }
      .logo-name {
        font-size: 25px;
      }

      header {
        display: flex;
        justify-content: space-between;
        text-align: center;
      }
      .nav-left {
        display: flex;
        align-items: center;
      }
      .nav-right ul {
        list-style: none;
        display: flex;
        gap: 10px;
        font-size: 25px;
      }
      .nav-right a {
        text-decoration: none;
      }

      .contact {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        max-width: 400px;
        width: 90%;
        height: auto;
        box-sizing: border-box;
        border: 1px solid gray;
        border-radius: 10px;
        margin: 0 auto;
        padding: 30px;
      }

      label {
        font-size: 15px;
        padding: 10px 0;
        display: block;
        margin-bottom: 8px;
      }

      input,
      textarea {
        font-size: 15px;
        padding: 8px;
        width: 100%;
        border-radius: 5px;
        outline: none;
        border: 1px solid #ddd;
      }

      textarea {
        resize: vertical;
        min-height: 120px;
      }

      button {
        padding: 12px;
        border-radius: 10px;
        border: none;
        background-color: slateblue;
        color: white;
        font-size: 15px;
        font-weight: 500;
        margin-top: 20px;
        cursor: pointer;
      }

      footer {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="nav-left">
        <img class="image" src="logo.png" alt="logo" />
        <p class="logo-name">Sundarapandiyan</p>
      </div>
      <nav class="nav-right">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="project.html">Projects</a></li>
          <li><a href="article.html">Article</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="contact">
        <h2>Contact Me</h2>
        <form action="" method="POST">
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" required />

          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required />

          <label for="message">Message:</label>
          <textarea id="message" name="message" rows="10" required></textarea>

          <button type="submit">Send Message</button>
        </form>
      </section>
    </main>
    <footer>
      <p>©️ all rights reserved 2025</p>
    </footer>
  </body>
</html>
